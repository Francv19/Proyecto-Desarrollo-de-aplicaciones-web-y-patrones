<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="menu/fragmentos :: menuHead"></th:block>
        <title>Menú · Urban Bites</title>
        <th:block th:replace="menu/fragmentos :: menuHeadContent"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='menu'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Food Trucks Section -->
                <section class="mb-5">
                    <h2 class="section-title">
                        <i class="bi bi-truck"></i>
                        Food Trucks
                    </h2>
                    
                    <!-- Search Bar -->
                    <div class="search-input-group mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Buscar food truck..." id="searchFoodtruck">
                            <button class="search-btn" type="button">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Food Truck Cards -->
                    <div class="row g-4" id="foodtrucksContainer">
                        <div class="col-md-4 col-lg-3" th:each="foodtruck : ${foodtrucks}">
                            <div class="foodtruck-card" 
                                 th:classappend="${selectedFoodtruck != null and selectedFoodtruck == foodtruck.idFoodtruck} ? 'selected' : ''"
                                 th:data-foodtruck-id="${foodtruck.idFoodtruck}"
                                 th:onclick="'selectFoodtruck(' + ${foodtruck.idFoodtruck} + ')'">
                                <div class="foodtruck-image-wrapper">
                                    <img th:src="${foodtruck.rutaImagen != null and !#strings.isEmpty(foodtruck.rutaImagen)} ? ${foodtruck.rutaImagen} : '/images/placeholder-truck.png'" 
                                         th:alt="${foodtruck.nombre}"
                                         class="foodtruck-image"
                                         onerror="this.src='/images/placeholder-truck.png'">
                                </div>
                                <div class="foodtruck-info">
                                    <h5 class="foodtruck-name" th:text="${foodtruck.nombre}">Grill & Go</h5>
                                    <p class="foodtruck-description" 
                                       th:text="${foodtruck.descripcion != null and !#strings.isEmpty(foodtruck.descripcion)} ? foodtruck.descripcion : 'Deliciosa comida al instante'">
                                        Sector 1, Espacio 2
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Menú Section -->
                <section>
                    <h2 class="section-title">
                        <i class="bi bi-journal-text"></i>
                        Menú
                        <span id="selectedFoodtruckBadge" class="badge bg-secondary ms-2 hidden-element">
                        <span id="selectedFoodtruckName"></span>
                        </span>
                        <button id="clearFilterBtn" class="btn btn-sm btn-outline-secondary ms-2 hidden-element" onclick="clearFoodtruckFilter()">
                            <i class="bi bi-x-circle me-1"></i>Limpiar filtro
                        </button>
                    </h2>
                    
                    <!-- Search Bar -->
                    <div class="search-input-group mb-4">
                        <div class="input-group">
                            <input type="text" class="form-control" placeholder="Buscar producto..." id="searchProducto">
                            <button class="search-btn" type="button">
                                <i class="bi bi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Product Cards -->
                    <div class="row g-4" id="productosContainer" th:if="${productos != null and !productos.isEmpty()}">
                        <div class="col-md-6 col-lg-4 producto-item" 
                             th:each="producto : ${productos}"
                             th:data-foodtruck-id="${producto.foodtruck.idFoodtruck}">
                            <div class="producto-card">
                                <img th:if="${producto.fotos != null and !producto.fotos.isEmpty()}" 
                                     th:src="${producto.fotos[0].url}" 
                                     th:alt="${producto.nombre}" 
                                     class="producto-img"
                                     onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div th:if="${producto.fotos == null or producto.fotos.isEmpty()}" 
                                     class="producto-img-placeholder">
                                    <i class="bi bi-image"></i>
                                </div>
                                <div class="producto-img-placeholder hidden-element">
                                    <i class="bi bi-image"></i>
                                </div>
                                <div class="p-3">
                                    <h5 class="fw-bold mb-2" th:text="${producto.nombre}">Combo #1</h5>
                                    <p class="text-muted small mb-3" 
                                       th:text="${producto.descripcion != null and !#strings.isEmpty(producto.descripcion)} ? producto.descripcion : 'Delicioso producto'">
                                        Descripción del producto
                                    </p>
                                    <div class="d-flex justify-content-between align-items-center mb-3">
                                        <span class="fw-bold fs-5 producto-price">
                                            ₡<span th:text="${#numbers.formatDecimal(producto.precio, 0, 'COMMA', 2, 'POINT')}">3,500.00</span>
                                        </span>
                                        <span class="badge producto-badge" 
                                              th:text="${producto.foodtruck.nombre}">Grill & Go</span>
                                    </div>
                                    <form th:action="@{/carrito/agregar}" method="post" class="d-inline w-100" th:id="'form-producto-' + ${producto.idProducto}">
                                        <input type="hidden" name="idProducto" th:value="${producto.idProducto}">
                                        <div class="quantity-controls">
                                            <button type="button" class="quantity-btn" 
                                                    th:onclick="'decreaseQuantity(' + ${producto.idProducto} + ')'"
                                                    th:id="'btn-decrease-' + ${producto.idProducto}">-</button>
                                            <input type="number" 
                                                   class="quantity-input" 
                                                   name="cantidad" 
                                                   th:id="'quantity-' + ${producto.idProducto}"
                                                   value="1" 
                                                   min="1" 
                                                   max="99"
                                                   readonly>
                                            <button type="button" class="quantity-btn" 
                                                    th:onclick="'increaseQuantity(' + ${producto.idProducto} + ')'"
                                                    th:id="'btn-increase-' + ${producto.idProducto}">+</button>
                                        </div>
                                        <button type="submit" class="btn btn-add-cart">
                                            <i class="bi bi-cart-plus me-2"></i>
                                            Agregar al Carrito
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="noProductsMessage" class="text-center py-5 hidden-element">
                        <i class="bi bi-inbox empty-icon"></i>
                        <p class="text-muted mt-3">No hay productos disponibles para este food truck.</p>
                    </div>
                    <div th:if="${productos == null or productos.isEmpty()}" class="text-center py-5">
                        <i class="bi bi-inbox empty-icon"></i>
                        <p class="text-muted mt-3">No hay productos disponibles en este momento.</p>
                    </div>
                </section>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
        <script th:src="@{/js/menu.js}"></script>
        <th:block th:replace="menu/fragmentos :: menuScripts"></th:block>
    </body>
</html>
