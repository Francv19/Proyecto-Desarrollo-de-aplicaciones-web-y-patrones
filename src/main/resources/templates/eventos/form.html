<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="eventos/fragmentos :: eventosHead"></th:block>
        <title>Solicitar Evento · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='eventos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="overflow-y: auto;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">Solicitar Evento</h2>
                    <a th:href="@{/eventos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="card" style="max-width: 700px; margin: 0 auto;">
                    <div class="card-header" style="background-color: #104E43; color: white;">
                        <h5 class="mb-0">Nueva Solicitud de Evento</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/eventos/crear}" method="post">
                            <div class="mb-3">
                                <label for="idFoodtruck" class="form-label">Food Truck</label>
                                <select class="form-select" id="idFoodtruck" name="idFoodtruck" required>
                                    <option value="">Seleccionar Food Truck...</option>
                                    <option th:each="ft : ${foodtrucks}" 
                                            th:value="${ft.idFoodtruck}"
                                            th:selected="${foodtruckSeleccionado != null and foodtruckSeleccionado == ft.idFoodtruck}"
                                            th:text="${ft.nombre}">Food Truck</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="tipoServicio" class="form-label">Tipo de Servicio</label>
                                <select class="form-select" id="tipoServicio" name="tipoServicio" required>
                                    <option value="catering">Catering</option>
                                    <option value="delivery">Delivery</option>
                                    <option value="otro">Otro</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Evento</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="4" 
                                          placeholder="Describe tu evento..."></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="invitados" class="form-label">Número de Invitados</label>
                                <input type="number" class="form-control" id="invitados" name="invitados" min="1">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="fechaInicio" class="form-label">Fecha y Hora de Inicio</label>
                                    <input type="datetime-local" class="form-control" id="fechaInicio" name="fechaInicio" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaFin" class="form-label">Fecha y Hora de Fin</label>
                                    <input type="datetime-local" class="form-control" id="fechaFin" name="fechaFin" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="latitud" class="form-label">Latitud (opcional)</label>
                                    <input type="number" class="form-control" id="latitud" name="latitud" 
                                           step="0.000001" placeholder="9.9281">
                                </div>
                                <div class="col-md-6">
                                    <label for="longitud" class="form-label">Longitud (opcional)</label>
                                    <input type="number" class="form-control" id="longitud" name="longitud" 
                                           step="0.000001" placeholder="-84.0907">
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn flex-grow-1" style="background-color: #ED3101; color: white;">
                                    Enviar Solicitud
                                </button>
                                <a th:href="@{/eventos}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
