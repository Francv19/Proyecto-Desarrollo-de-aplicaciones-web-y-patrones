<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="eventos/fragmentos :: eventosHead"></th:block>
        <title>Solicitar Evento · Urban Bites</title>
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='eventos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0" th:text="${evento != null and evento.idEvento != null ? 'Editar Evento' : 'Solicitar Evento'}">Solicitar Evento</h2>
                    <a th:href="@{/eventos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="card form-card-centered">
                    <div class="card-header card-header-urban">
                        <h5 class="mb-0" th:text="${evento != null and evento.idEvento != null ? 'Editar Solicitud de Evento' : 'Nueva Solicitud de Evento'}">Nueva Solicitud de Evento</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="${evento != null and evento.idEvento != null ? '/eventos/' + evento.idEvento + '/actualizar' : '/eventos/crear'}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="idFoodtruck" class="form-label">Food Truck</label>
                                <select class="form-select" id="idFoodtruck" name="idFoodtruck" required>
                                    <option value="">Seleccionar Food Truck...</option>
                                    <option th:each="ft : ${foodtrucks}" 
                                            th:value="${ft.idFoodtruck}"
                                            th:selected="${(foodtruckSeleccionado != null and foodtruckSeleccionado == ft.idFoodtruck) or (evento != null and evento.foodtruck != null and evento.foodtruck.idFoodtruck == ft.idFoodtruck)}"
                                            th:text="${ft.nombre}">Food Truck</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="tipoServicio" class="form-label">Tipo de Servicio</label>
                                <select class="form-select" id="tipoServicio" name="tipoServicio" required>
                                    <option value="catering" th:selected="${evento != null and evento.tipoServicio != null and evento.tipoServicio.name() == 'catering'}">Catering</option>
                                    <option value="delivery" th:selected="${evento != null and evento.tipoServicio != null and evento.tipoServicio.name() == 'delivery'}">Delivery</option>
                                    <option value="otro" th:selected="${evento != null and evento.tipoServicio != null and evento.tipoServicio.name() == 'otro'}">Otro</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Evento</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" 
                                       th:value="${evento?.nombre}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea class="form-control" id="descripcion" name="descripcion" rows="4" 
                                          placeholder="Describe tu evento..." th:text="${evento?.descripcion}"></textarea>
                            </div>
                            
                            <div class="mb-3">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" 
                                       th:value="${evento?.direccion}" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="invitados" class="form-label">Número de Invitados</label>
                                <input type="number" class="form-control" id="invitados" name="invitados" min="1"
                                       th:value="${evento?.invitados}">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="fechaInicio" class="form-label">Fecha y Hora de Inicio</label>
                                    <input type="datetime-local" class="form-control" id="fechaInicio" name="fechaInicio" 
                                           th:value="${evento?.fechaInicio != null ? #temporals.format(evento.fechaInicio, 'yyyy-MM-dd') + 'T' + #temporals.format(evento.fechaInicio, 'HH:mm') : ''}" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaFin" class="form-label">Fecha y Hora de Fin</label>
                                    <input type="datetime-local" class="form-control" id="fechaFin" name="fechaFin" 
                                           th:value="${evento?.fechaFin != null ? #temporals.format(evento.fechaFin, 'yyyy-MM-dd') + 'T' + #temporals.format(evento.fechaFin, 'HH:mm') : ''}" required>
                                </div>
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="latitud" class="form-label">Latitud (opcional)</label>
                                    <input type="number" class="form-control" id="latitud" name="latitud" 
                                           step="0.000001" placeholder="9.9281" th:value="${evento?.latitud}">
                                </div>
                                <div class="col-md-6">
                                    <label for="longitud" class="form-label">Longitud (opcional)</label>
                                    <input type="number" class="form-control" id="longitud" name="longitud" 
                                           step="0.000001" placeholder="-84.0907" th:value="${evento?.longitud}">
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/eventos}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-urban-cta">
                                    <i class="bi bi-check-circle me-2"></i>
                                    <span th:text="${evento != null and evento.idEvento != null ? 'Actualizar Evento' : 'Enviar Solicitud'}">Enviar Solicitud</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="eventos/fragmentos :: eventosScripts"></th:block>
    </body>
</html>
