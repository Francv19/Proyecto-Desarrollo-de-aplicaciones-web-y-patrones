<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="admin/horarios/fragmentos :: horariosAdminHead"></th:block>
        <title>Gestión de Horarios · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='horarios'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarAdmin(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="overflow-y: auto; background-color: #f5f5f5;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">Gestión de Horarios</h2>
                </div>

                <th:block th:replace="admin/horarios/fragmentos :: horariosAdminAlerts"></th:block>

                <!-- Selector de Food Truck -->
                <div class="card mb-4">
                    <div class="card-body">
                        <form method="get" action="/admin/horarios" class="d-flex gap-2">
                            <select name="idFoodtruck" class="form-select" onchange="this.form.submit()">
                                <option value="">Seleccionar Food Truck...</option>
                                <option th:each="ft : ${foodtrucks}" 
                                        th:value="${ft.idFoodtruck}"
                                        th:selected="${foodtruckId != null and foodtruckId == ft.idFoodtruck}"
                                        th:text="${ft.nombre}">Food Truck</option>
                            </select>
                        </form>
                    </div>
                </div>

                <!-- Lista de Horarios -->
                <div th:if="${foodtruckId != null and horarios != null}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h4 class="mb-0">Horarios del Food Truck</h4>
                        <a th:href="@{/admin/horarios/nuevo(idFoodtruck=${foodtruckId})}" 
                           class="btn" style="background-color: #ED3101; color: white;">
                            <i class="bi bi-plus-circle"></i> Nuevo Horario
                        </a>
                    </div>

                    <div th:if="${horarios != null and !horarios.isEmpty()}">
                        <div class="table-responsive">
                            <table class="table table-hover">
                                <thead>
                                    <tr>
                                        <th>Día</th>
                                        <th>Hora Apertura</th>
                                        <th>Hora Cierre</th>
                                        <th>Dirección</th>
                                        <th>Coordenadas</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="horario : ${horarios}">
                                        <td th:text="${horario.getNombreDia()}">Lunes</td>
                                        <td th:text="${#temporals.format(horario.horaApertura, 'HH:mm')}">08:00</td>
                                        <td th:text="${#temporals.format(horario.horaCierre, 'HH:mm')}">18:00</td>
                                        <td th:text="${horario.direccion ?: 'N/A'}">Dirección</td>
                                        <td>
                                            <span th:if="${horario.latitud != null and horario.longitud != null}"
                                                  th:text="${horario.latitud} + ', ' + ${horario.longitud}">Lat, Lng</span>
                                            <span th:if="${horario.latitud == null or horario.longitud == null}">N/A</span>
                                        </td>
                                        <td>
                                            <span class="badge" 
                                                  th:class="${horario.activo} ? 'bg-success' : 'bg-secondary'"
                                                  th:text="${horario.activo} ? 'Activo' : 'Inactivo'">
                                                Activo
                                            </span>
                                        </td>
                                        <td>
                                            <form th:action="@{/admin/horarios/{id}/eliminar(id=${horario.idHorario})}" 
                                                  method="post" class="d-inline">
                                                <input type="hidden" name="idFoodtruck" th:value="${foodtruckId}">
                                                <button type="submit" class="btn btn-sm btn-danger" 
                                                        onclick="return confirm('¿Estás seguro de eliminar este horario?')">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                            <form th:if="${horario.activo}" 
                                                  th:action="@{/admin/horarios/{id}/desactivar(id=${horario.idHorario})}" 
                                                  method="post" class="d-inline">
                                                <input type="hidden" name="idFoodtruck" th:value="${foodtruckId}">
                                                <button type="submit" class="btn btn-sm btn-warning">
                                                    <i class="bi bi-pause-circle"></i> Desactivar
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div th:if="${horarios == null or horarios.isEmpty()}">
                        <p class="text-muted text-center py-3">No hay horarios configurados para este food truck</p>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
