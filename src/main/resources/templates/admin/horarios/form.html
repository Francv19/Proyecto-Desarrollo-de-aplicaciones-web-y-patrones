<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="admin/horarios/fragmentos :: horariosAdminHead"></th:block>
        <title>Nuevo Horario · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='horarios'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarAdmin(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 main-bg-gray">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">Nuevo Horario</h2>
                    <a th:href="@{/admin/horarios(idFoodtruck=${foodtruck.idFoodtruck})}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="card form-card-medium">
                    <div class="card-header card-header-urban-bg">
                        <h5 class="mb-0" th:text="'Food Truck: ' + ${foodtruck.nombre}">Food Truck</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/admin/horarios/crear}" method="post">
                            <input type="hidden" name="idFoodtruck" th:value="${foodtruck.idFoodtruck}">
                            
                            <div class="mb-3">
                                <label for="diaSemana" class="form-label">Día de la Semana</label>
                                <select class="form-select" id="diaSemana" name="diaSemana" required>
                                    <option value="1">Lunes</option>
                                    <option value="2">Martes</option>
                                    <option value="3">Miércoles</option>
                                    <option value="4">Jueves</option>
                                    <option value="5">Viernes</option>
                                    <option value="6">Sábado</option>
                                    <option value="7">Domingo</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="horaApertura" class="form-label">Hora de Apertura</label>
                                <input type="time" class="form-control" id="horaApertura" name="horaApertura" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="horaCierre" class="form-label">Hora de Cierre</label>
                                <input type="time" class="form-control" id="horaCierre" name="horaCierre" required>
                            </div>
                            
                            <div class="mb-3">
                                <label for="direccion" class="form-label">Dirección</label>
                                <input type="text" class="form-control" id="direccion" name="direccion" 
                                       placeholder="Ej: Plaza Central, San José">
                            </div>
                            
                            <div class="row mb-3">
                                <div class="col-md-6">
                                    <label for="latitud" class="form-label">Latitud</label>
                                    <input type="number" class="form-control" id="latitud" name="latitud" 
                                           step="0.000001" placeholder="9.9281">
                                </div>
                                <div class="col-md-6">
                                    <label for="longitud" class="form-label">Longitud</label>
                                    <input type="number" class="form-control" id="longitud" name="longitud" 
                                           step="0.000001" placeholder="-84.0907">
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/admin/horarios(idFoodtruck=${foodtruck.idFoodtruck})}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-urban-cta">
                                    <i class="bi bi-check-circle me-2"></i>Crear Horario
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
