<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionHead"></th:block>
        <title th:text="${usuario != null ? 'Editar Usuario' : 'Nuevo Usuario'}">Usuario · Urban Bites</title>
        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionHeadContent"></th:block>
        <link rel="stylesheet" th:href="@{/css/common.css}">
    </head>
    <body class="bg-light" th:with="currentPage='configuracion'">
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarAdmin(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <div class="form-card form-card-medium">
                    <h2 class="form-title" th:text="${usuario != null ? 'Editar Usuario' : 'Crear Nuevo Usuario'}"></h2>
                    
                    <div th:if="${mensaje}" class="alert alert-success" role="alert">
                        <span th:text="${mensaje}"></span>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>
                    
                    <form th:action="${usuario != null ? '/admin/configuracion/usuarios/' + usuario.idUsuario + '/actualizar' : '/admin/configuracion/usuarios/crear'}" 
                          method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   th:value="${usuario?.nombre}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="apellidos" class="form-label">Apellidos</label>
                            <input type="text" class="form-control" id="apellidos" name="apellidos" 
                                   th:value="${usuario?.apellidos}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="correo" class="form-label">Correo (Username)</label>
                            <input type="email" class="form-control" id="correo" name="correo" 
                                   th:value="${usuario?.correo}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Contraseña <span th:if="${usuario != null}" class="text-muted">(dejar vacío para no cambiar)</span>
                            </label>
                            <input type="password" class="form-control" id="password" name="password" 
                                   th:required="${usuario == null}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="text" class="form-control" id="telefono" name="telefono" 
                                   th:value="${usuario?.telefono}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="idRol" class="form-label">Rol</label>
                            <select class="form-select" id="idRol" name="idRol" required>
                                <option value="">Seleccione un rol</option>
                                <option th:each="rol : ${roles}" 
                                        th:value="${rol.idRol}" 
                                        th:text="${rol.nombre}"
                                        th:selected="${usuario != null and usuario.roles != null and !usuario.roles.isEmpty() and usuario.roles[0].idRol == rol.idRol}">
                                </option>
                            </select>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary-custom">
                                <span th:text="${usuario != null ? 'Actualizar' : 'Crear'}"></span>
                            </button>
                            <a th:href="@{/admin/configuracion}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionScripts"></th:block>
    </body>
</html>
