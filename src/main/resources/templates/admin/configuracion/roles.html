<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionHead"></th:block>
        <title>Gestión de Roles · Urban Bites</title>
        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionHeadContent"></th:block>
        <link rel="stylesheet" th:href="@{/css/configuracion.css}">
    </head>
    <body class="bg-light" th:with="currentPage=${page} ?: 'configuracion'">
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarAdmin(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 main-bg-white">
                <div class="page-title">
                    <h1>Gestion de Roles</h1>
                    <div class="title-icon">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                </div>

                <div th:if="${mensaje}" class="alert alert-success" role="alert">
                    <span th:text="${mensaje}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div class="users-section">
                    <div class="user-card">
                        <div class="user-card-header">
                            <div>
                                <h2 class="user-name">Usuarios</h2>
                            </div>
                            <div class="user-actions">
                                <a th:href="@{/admin/configuracion/usuarios/nuevo}" class="btn-action">CREAR NUEVO USUARIO</a>
                            </div>
                        </div>
                    </div>

                    <div th:each="usuario : ${usuarios}" class="user-card">
                        <div class="user-card-header">
                            <div>
                                <h3 class="user-name" th:text="${usuario.nombre}"></h3>
                                <p class="user-role" th:if="${usuario.roles != null and !usuario.roles.isEmpty()}" 
                                   th:text="${usuario.roles[0].nombre}"></p>
                                <p class="user-role" th:if="${usuario.roles == null or usuario.roles.isEmpty()}">Sin rol</p>
                            </div>
                            <div class="user-actions">
                                <a th:href="@{/admin/configuracion/usuarios/{id}/editar(id=${usuario.idUsuario})}" 
                                   class="btn-action secondary">EDITAR</a>
                                <form th:action="@{/admin/configuracion/usuarios/{id}/eliminar(id=${usuario.idUsuario})}" 
                                      method="post" class="d-inline"
                                      th:onsubmit="'return confirm(\'¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.\');'">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn-action">ELIMINAR</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="admin/configuracion/fragmentos :: adminConfiguracionScripts"></th:block>
    </body>
</html>
