<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Gestión de Roles · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <style>
            .config-tabs {
                display: flex;
                gap: 0.5rem;
                margin-bottom: 2rem;
            }
            .config-tab {
                padding: 0.75rem 1.5rem;
                border: 2px solid #104E43;
                background: white;
                color: #104E43;
                border-radius: 50px;
                text-decoration: none;
                font-weight: 600;
                transition: all 0.2s;
            }
            .config-tab.active {
                background: #104E43;
                color: white;
            }
            .config-tab:hover {
                background: #104E43;
                color: white;
            }
            .page-title {
                display: flex;
                align-items: center;
                gap: 1rem;
                margin-bottom: 2rem;
            }
            .page-title h1 {
                font-size: 2.5rem;
                font-weight: bold;
                color: #104E43;
                margin: 0;
            }
            .title-icon {
                width: 50px;
                height: 50px;
                background: #ED3101;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: white;
                font-size: 1.5rem;
            }
            .user-card {
                border: 2px solid #104E43;
                border-radius: 12px;
                padding: 1.5rem;
                margin-bottom: 1rem;
                background: white;
            }
            .user-card-header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 0.5rem;
            }
            .user-name {
                font-size: 1.5rem;
                font-weight: bold;
                color: #104E43;
                margin: 0;
            }
            .user-role {
                color: #666;
                font-size: 0.9rem;
                margin: 0.25rem 0;
            }
            .user-actions {
                display: flex;
                gap: 0.75rem;
            }
            .btn-action {
                padding: 0.5rem 1.25rem;
                border-radius: 8px;
                border: none;
                font-weight: 600;
                font-size: 0.9rem;
                background: #ED3101;
                color: white;
                text-decoration: none;
                display: inline-block;
                transition: all 0.2s;
            }
            .btn-action:hover {
                background: #c02801;
                color: white;
            }
            .btn-action.secondary {
                background: #104E43;
            }
            .btn-action.secondary:hover {
                background: #0a3d35;
            }
            .users-section {
                margin-top: 2rem;
            }
            .alert {
                border-radius: 8px;
                margin-bottom: 1.5rem;
            }
        </style>
    </head>
    <body class="bg-light" th:with="currentPage=${page} ?: 'configuracion'">
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarAdmin(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="background: white;">
                <div class="page-title">
                    <h1>Gestion de Roles</h1>
                    <div class="title-icon">
                        <i class="bi bi-arrow-right"></i>
                    </div>
                </div>

                <div th:if="${mensaje}" class="alert alert-success" role="alert">
                    <span th:text="${mensaje}"></span>
                </div>
                <div th:if="${error}" class="alert alert-danger" role="alert">
                    <span th:text="${error}"></span>
                </div>

                <div class="users-section">
                    <div class="user-card">
                        <div class="user-card-header">
                            <div>
                                <h2 class="user-name">Usuarios</h2>
                            </div>
                            <div class="user-actions">
                                <a th:href="@{/admin/configuracion/usuarios/nuevo}" class="btn-action">CREAR NUEVO USUARIO</a>
                            </div>
                        </div>
                    </div>

                    <div th:each="usuario : ${usuarios}" class="user-card">
                        <div class="user-card-header">
                            <div>
                                <h3 class="user-name" th:text="${usuario.nombre}"></h3>
                                <p class="user-role" th:if="${usuario.roles != null and !usuario.roles.isEmpty()}" 
                                   th:text="${usuario.roles[0].nombre}"></p>
                                <p class="user-role" th:if="${usuario.roles == null or usuario.roles.isEmpty()}">Sin rol</p>
                            </div>
                            <div class="user-actions">
                                <a th:href="@{/admin/configuracion/usuarios/{id}/editar(id=${usuario.idUsuario})}" 
                                   class="btn-action secondary">EDITAR</a>
                                <form th:action="@{/admin/configuracion/usuarios/{id}/eliminar(id=${usuario.idUsuario})}" 
                                      method="post" style="display: inline;"
                                      onsubmit="return confirm('¿Estás seguro de que deseas eliminar este usuario? Esta acción no se puede deshacer.');">
                                    <button type="submit" class="btn-action">ELIMINAR</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
