<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear Administrador · Urban Bites</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background: linear-gradient(135deg, #104E43 0%, #1C1C1C 100%);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .setup-card {
                background: white;
                border-radius: 16px;
                padding: 2rem;
                max-width: 500px;
                width: 100%;
                box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            }
        </style>
    </head>
    <body>
        <div class="setup-card">
            <h2 class="mb-4 text-center">Crear Usuario Administrador</h2>
            
            <div th:if="${mensaje}" class="alert alert-success" role="alert">
                <span th:text="${mensaje}"></span>
            </div>
            
            <div th:if="${error}" class="alert alert-danger" role="alert">
                <span th:text="${error}"></span>
            </div>
            
            <form th:action="@{/setup/admin}" method="post">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required>
                </div>
                
                <div class="mb-3">
                    <label for="apellidos" class="form-label">Apellidos</label>
                    <input type="text" class="form-control" id="apellidos" name="apellidos" required>
                </div>
                
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo (será el username)</label>
                    <input type="email" class="form-control" id="correo" name="correo" required>
                </div>
                
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono (opcional)</label>
                    <input type="text" class="form-control" id="telefono" name="telefono">
                </div>
                
                <button type="submit" class="btn btn-primary w-100" style="background-color: #ED3101; border-color: #ED3101;">
                    Crear Administrador
                </button>
            </form>
            
            <div class="mt-3 text-center">
                <a th:href="@{/login}" class="text-decoration-none">Volver al login</a>
            </div>
            
            <div class="mt-4 alert alert-warning">
                <small><strong>Nota:</strong> Después de crear el administrador, elimina o deshabilita este controlador por seguridad.</small>
            </div>
        </div>
    </body>
</html>
