<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="owner/eventos/fragmentos :: eventosOwnerHead"></th:block>
        <title>Cotizar Evento · Urban Bites</title>
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='eventos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 main-bg-gray">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0" th:text="${esEdicion ? 'Editar Cotización' : 'Cotizar Evento'}">Cotizar Evento</h2>
                    <a th:href="@{/owner/eventos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left"></i> Volver
                    </a>
                </div>

                <div class="card mb-4">
                    <div class="card-header card-header-urban-bg">
                        <h5 class="mb-0" th:text="${evento.nombre}">Evento</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <p class="mb-2"><strong>Solicitante:</strong> 
                                    <span th:text="${evento.solicitante.nombre + ' ' + evento.solicitante.apellidos}">Cliente</span>
                                </p>
                                <p class="mb-2"><strong>Tipo de Servicio:</strong> 
                                    <span th:text="${#strings.capitalize(evento.tipoServicio.name())}">Catering</span>
                                </p>
                                <p class="mb-2"><strong>Fecha:</strong> 
                                    <span th:text="${#temporals.format(evento.fechaInicio, 'dd MMM yyyy, hh:mm a')}">Inicio</span>
                                    <span> - </span>
                                    <span th:text="${#temporals.format(evento.fechaFin, 'dd MMM yyyy, hh:mm a')}">Fin</span>
                                </p>
                            </div>
                            <div class="col-md-6">
                                <p class="mb-2" th:if="${evento.direccion != null}">
                                    <strong>Dirección:</strong> <span th:text="${evento.direccion}">Dirección</span>
                                </p>
                                <p class="mb-2" th:if="${evento.invitados != null}">
                                    <strong>Invitados:</strong> <span th:text="${evento.invitados}">0</span>
                                </p>
                            </div>
                        </div>
                        <div th:if="${evento.descripcion != null and !#strings.isEmpty(evento.descripcion)}">
                            <p class="mb-2"><strong>Descripción:</strong></p>
                            <p class="text-muted" th:text="${evento.descripcion}">Descripción</p>
                        </div>
                    </div>
                </div>

                <div class="card form-card-medium">
                    <div class="card-header card-header-urban-bg">
                        <h5 class="mb-0" th:text="${esEdicion ? 'Editar Cotización' : 'Cotización'}">Cotización</h5>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/owner/eventos/{id}/cotizar(id=${evento.idEvento})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label for="montoCotizado" class="form-label">Monto Cotizado (₡)</label>
                                <input type="number" class="form-control" id="montoCotizado" name="montoCotizado" 
                                       step="0.01" min="0.01" required
                                       th:value="${evento.montoCotizado != null ? evento.montoCotizado : ''}">
                            </div>
                            
                            <div class="mb-3">
                                <label for="detallesCotizacion" class="form-label">Detalles de la Cotización</label>
                                <textarea class="form-control" id="detallesCotizacion" name="detallesCotizacion" 
                                          rows="5" placeholder="Incluye detalles sobre el servicio, menú, condiciones, etc..."
                                          th:text="${evento.detallesCotizacion}"></textarea>
                            </div>
                            
                            <div class="d-flex gap-2 justify-content-end">
                                <a th:href="@{/owner/eventos}" class="btn btn-outline-secondary">
                                    Cancelar
                                </a>
                                <button type="submit" class="btn btn-urban-cta">
                                    <i class="bi me-2" th:classappend="${esEdicion ? 'bi-check-circle' : 'bi-send'}"></i>
                                    <span th:text="${esEdicion ? 'Actualizar Cotización' : 'Enviar Cotización'}">Enviar Cotización</span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="owner/eventos/fragmentos :: eventosOwnerScripts"></th:block>
    </body>
</html>
