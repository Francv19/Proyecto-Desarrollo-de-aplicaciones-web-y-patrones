<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${producto != null and producto.idProducto != null ? 'Editar Producto' : 'Nuevo Producto'}">Producto · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
        <style>
            .form-card {
                background: white;
                border: 2px solid #104E43;
                border-radius: 12px;
                padding: 2rem;
                max-width: 700px;
                margin: 0 auto;
            }
            .form-title {
                color: #104E43;
                font-weight: bold;
                margin-bottom: 1.5rem;
            }
            .btn-primary-custom {
                background: #ED3101;
                border-color: #ED3101;
                color: white;
            }
            .btn-primary-custom:hover {
                background: #c02801;
                border-color: #c02801;
            }
        </style>
    </head>
    <body class="bg-light" th:with="currentPage='productos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="overflow-y: auto;">
                <div class="form-card">
                    <h2 class="form-title" th:text="${producto != null and producto.idProducto != null ? 'Editar Producto' : 'Crear Nuevo Producto'}"></h2>
                    
                    <div th:if="${mensaje}" class="alert alert-success" role="alert">
                        <span th:text="${mensaje}"></span>
                    </div>
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <span th:text="${error}"></span>
                    </div>
                    
                    <form th:action="${producto != null and producto.idProducto != null ? '/owner/productos/' + producto.idProducto + '/actualizar' : '/owner/productos/crear'}" 
                          method="post">
                        <div class="mb-3">
                            <label for="idMenu" class="form-label">Menú <span class="text-danger">*</span></label>
                            <select class="form-select" id="idMenu" name="idMenu" required>
                                <option value="">Seleccione un menú</option>
                                <option th:each="menu : ${menus}" 
                                        th:value="${menu.idMenu}" 
                                        th:text="${menu.nombre}"
                                        th:selected="${producto != null and producto.menu != null and producto.menu.idMenu == menu.idMenu}">
                                </option>
                            </select>
                            <small class="form-text text-muted">Seleccione el menú al que pertenece este producto</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre del Producto <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="nombre" name="nombre" 
                                   th:value="${producto?.nombre}" 
                                   maxlength="120" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" name="descripcion" 
                                      rows="3" 
                                      maxlength="400"
                                      th:text="${producto?.descripcion}"></textarea>
                            <small class="form-text text-muted">Máximo 400 caracteres</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio (₡) <span class="text-danger">*</span></label>
                            <input type="number" 
                                   class="form-control" 
                                   id="precio" 
                                   name="precio" 
                                   th:value="${producto?.precio != null ? #numbers.formatDecimal(producto.precio, 0, 'POINT', 2, 'POINT') : ''}"
                                   step="0.01" 
                                   min="0.01" 
                                   required>
                            <small class="form-text text-muted">El precio debe ser mayor a 0</small>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       id="disponible" 
                                       name="disponible" 
                                       value="true"
                                       th:checked="${producto == null or producto.disponible == null or producto.disponible}">
                                <label class="form-check-label" for="disponible">
                                    Producto disponible
                                </label>
                            </div>
                            <small class="form-text text-muted">Si está desmarcado, el producto no aparecerá en el menú para clientes</small>
                        </div>
                        
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary-custom">
                                <span th:text="${producto != null and producto.idProducto != null ? 'Actualizar' : 'Crear'}"></span>
                            </button>
                            <a th:href="@{/owner/productos}" class="btn btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
        <script>
            // Validación del precio
            document.getElementById('precio').addEventListener('input', function(e) {
                const value = parseFloat(e.target.value);
                if (value <= 0) {
                    e.target.setCustomValidity('El precio debe ser mayor a 0');
                } else {
                    e.target.setCustomValidity('');
                }
            });
        </script>
    </body>
</html>
