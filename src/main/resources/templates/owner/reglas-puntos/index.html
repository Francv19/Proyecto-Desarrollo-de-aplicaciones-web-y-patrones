<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="owner/reglas-puntos/fragmentos :: reglasPuntosHead"></th:block>
        <title>Reglas de Puntos · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
        <th:block th:replace="owner/reglas-puntos/fragmentos :: reglasPuntosStyles"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='reglas-puntos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="overflow-y: auto; background-color: #f5f5f5;">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold mb-0">Reglas de Puntos</h2>
                    <a th:href="@{/owner/foodtrucks}" class="btn" style="background-color: #104E43; color: white;">
                        <i class="bi bi-arrow-left"></i> Volver a Food Trucks
                    </a>
                </div>

                <th:block th:replace="owner/reglas-puntos/fragmentos :: reglasPuntosAlerts"></th:block>

                <div th:if="${foodtrucks != null and !foodtrucks.isEmpty()}">
                    <div class="card mb-4" th:each="foodtruck : ${foodtrucks}">
                        <div class="card-header d-flex justify-content-between align-items-center" style="background-color: #104E43; color: white;">
                            <h5 class="mb-0" th:text="${foodtruck.nombre}">Food Truck</h5>
                            <a th:href="@{/owner/reglas-puntos/nuevo(idFoodtruck=${foodtruck.idFoodtruck})}" 
                               class="btn btn-sm" style="background-color: #ED3101; color: white;">
                                <i class="bi bi-plus-circle"></i> Nueva Regla
                            </a>
                        </div>
                        <div class="card-body">
                            <div th:if="${reglasPorFoodtruck != null and reglasPorFoodtruck.get(foodtruck.idFoodtruck) != null and !reglasPorFoodtruck.get(foodtruck.idFoodtruck).isEmpty()}">
                                <div class="table-responsive">
                                    <table class="table table-hover">
                                        <thead>
                                            <tr>
                                                <th>Porcentaje</th>
                                                <th>Fecha Inicio</th>
                                                <th>Fecha Fin</th>
                                                <th>Estado</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr th:each="regla : ${reglasPorFoodtruck.get(foodtruck.idFoodtruck)}">
                                                <td th:text="${regla.porcentaje} + '%'">0%</td>
                                                <td th:text="${#temporals.format(regla.fechaInicio, 'dd MMM yyyy, hh:mm a')}">Fecha</td>
                                                <td th:text="${#temporals.format(regla.fechaFin, 'dd MMM yyyy, hh:mm a')}">Fecha</td>
                                                <td>
                                                    <span class="badge" 
                                                          th:class="${regla.activo} ? 'bg-success' : 'bg-secondary'"
                                                          th:text="${regla.activo} ? 'Activa' : 'Inactiva'">
                                                        Activa
                                                    </span>
                                                </td>
                                                <td>
                                                    <form th:action="@{/owner/reglas-puntos/{id}/eliminar(id=${regla.idRegla})}" 
                                                          method="post" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-danger" 
                                                                onclick="return confirm('¿Estás seguro de eliminar esta regla?')">
                                                            <i class="bi bi-trash"></i>
                                                        </button>
                                                    </form>
                                                    <form th:if="${regla.activo}" 
                                                          th:action="@{/owner/reglas-puntos/{id}/desactivar(id=${regla.idRegla})}" 
                                                          method="post" class="d-inline">
                                                        <button type="submit" class="btn btn-sm btn-warning">
                                                            <i class="bi bi-pause-circle"></i> Desactivar
                                                        </button>
                                                    </form>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                            <div th:if="${reglasPorFoodtruck == null or reglasPorFoodtruck.get(foodtruck.idFoodtruck) == null or reglasPorFoodtruck.get(foodtruck.idFoodtruck).isEmpty()}">
                                <p class="text-muted text-center py-3">No hay reglas de puntos configuradas para este food truck</p>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
