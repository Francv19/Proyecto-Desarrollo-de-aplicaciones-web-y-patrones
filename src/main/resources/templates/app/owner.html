<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Urban Bites · Owner</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage=${page} ?: 'dashboard'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <section class="mb-4">
                    <p class="text-uppercase fw-semibold text-secondary mb-1">Panel Owner</p>
                    <h1 class="display-6 fw-bold text-dark">Vista base para propietarios</h1>
                    <p class="text-muted mb-0">Coloca aquí los componentes específicos (dashboard, pedidos, promociones, etc.).</p>
                </section>

                <section class="bg-white rounded-4 p-4 shadow-sm">
                    <p class="mb-0 text-muted">Contenido de ejemplo</p>
                    <div class="border rounded-4 p-3 mt-3">
                        <p class="mb-0">Este bloque sirve como placeholder para los módulos del app de propietarios. Sustitúyelo con el contenido real según la pantalla seleccionada.</p>
                    </div>
                </section>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
