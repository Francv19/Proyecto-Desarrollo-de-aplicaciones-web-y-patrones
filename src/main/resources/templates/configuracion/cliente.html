<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="configuracion/fragmentos :: configuracionHead"></th:block>
        <title>Configuración · Urban Bites</title>
        <th:block th:replace="configuracion/fragmentos :: configuracionHeadContent"></th:block>
        <link rel="stylesheet" th:href="@{/css/configuracion.css}">
    </head>
    <body class="bg-light" th:with="currentPage='configuracion'">
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 main-scrollable">
                <div class="config-card">
                    <h1 class="config-title">
                        <i class="bi bi-gear-fill"></i>
                        Configuración de Perfil
                    </h1>

                    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/configuracion/actualizar}" method="post">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" 
                                       th:value="${usuario.nombre}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" 
                                       th:value="${usuario.apellidos}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" name="correo" 
                                       th:value="${usuario.correo}" required>
                                <div class="info-text">Este será tu nombre de usuario para iniciar sesión</div>
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" 
                                       th:value="${usuario.telefono}" required>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="password" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Dejar en blanco para no cambiar">
                                <div class="info-text">Mínimo 6 caracteres</div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                                       placeholder="Confirmar nueva contraseña">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-save">
                                <i class="bi bi-check-circle me-2"></i>
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <th:block th:replace="configuracion/fragmentos :: configuracionScripts"></th:block>
    </body>
</html>
