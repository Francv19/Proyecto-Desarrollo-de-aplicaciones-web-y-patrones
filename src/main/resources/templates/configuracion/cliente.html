<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Configuración · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
        <style>
            :root {
                --urban-primary: #104E43;
                --urban-secondary: #FFE5B4;
                --urban-cta: #ED3101;
                --urban-light: #F4F4F4;
                --urban-ink: #1C1C1C;
            }
            .config-card {
                background: white;
                border-radius: 12px;
                padding: 2rem;
                box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
                margin-bottom: 1.5rem;
            }
            .config-title {
                color: var(--urban-primary);
                font-weight: bold;
                font-size: 1.75rem;
                margin-bottom: 1.5rem;
                display: flex;
                align-items: center;
                gap: 0.75rem;
            }
            .form-label {
                color: var(--urban-ink);
                font-weight: 600;
                margin-bottom: 0.5rem;
            }
            .form-control {
                border: 2px solid #ddd;
                border-radius: 8px;
                padding: 0.75rem;
                transition: border-color 0.3s ease;
            }
            .form-control:focus {
                border-color: var(--urban-primary);
                box-shadow: 0 0 0 0.2rem rgba(16, 78, 67, 0.25);
            }
            .btn-save {
                background-color: var(--urban-cta);
                color: white;
                border: none;
                padding: 0.75rem 2rem;
                border-radius: 8px;
                font-weight: 600;
                transition: background-color 0.3s ease;
            }
            .btn-save:hover {
                background-color: #c02801;
                color: white;
            }
            .info-text {
                color: #666;
                font-size: 0.9rem;
                margin-top: 0.25rem;
            }
        </style>
    </head>
    <body class="bg-light" th:with="currentPage='configuracion'">
        <th:block th:replace="general/fragmentos :: sidebarStyles"></th:block>
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4" style="overflow-y: auto;">
                <div class="config-card">
                    <h1 class="config-title">
                        <i class="bi bi-gear-fill"></i>
                        Configuración de Perfil
                    </h1>

                    <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <span th:text="${mensaje}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/configuracion/actualizar}" method="post">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre</label>
                                <input type="text" class="form-control" id="nombre" name="nombre" 
                                       th:value="${usuario.nombre}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="apellidos" class="form-label">Apellidos</label>
                                <input type="text" class="form-control" id="apellidos" name="apellidos" 
                                       th:value="${usuario.apellidos}" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" name="correo" 
                                       th:value="${usuario.correo}" required>
                                <div class="info-text">Este será tu nombre de usuario para iniciar sesión</div>
                            </div>
                            <div class="col-md-6">
                                <label for="telefono" class="form-label">Teléfono</label>
                                <input type="tel" class="form-control" id="telefono" name="telefono" 
                                       th:value="${usuario.telefono}" required>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label for="password" class="form-label">Nueva Contraseña</label>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="Dejar en blanco para no cambiar">
                                <div class="info-text">Mínimo 6 caracteres</div>
                            </div>
                            <div class="col-md-6">
                                <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                                <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" 
                                       placeholder="Confirmar nueva contraseña">
                            </div>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-save">
                                <i class="bi bi-check-circle me-2"></i>
                                Guardar Cambios
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
    </body>
</html>
