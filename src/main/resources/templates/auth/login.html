<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:classappend="auth-page">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión · Urban Bites</title>
        <th:block th:replace="auth/head :: authHead"></th:block>
    </head>
    <body class="auth-page">
        <th:block th:replace="auth/fragmentos :: authBackground"></th:block>
        
        <div class="auth-card">
            <th:block th:replace="auth/fragmentos :: authLogo"></th:block>
            
            <h1 class="auth-title">Iniciar Sesión</h1>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="correo" class="auth-form-label">Correo</label>
                    <input type="email" class="form-control auth-form-control" id="correo" name="username" 
                           placeholder="usuario@email.com" required>
                </div>
                
                <div class="mb-3">
                    <label for="contraseña" class="auth-form-label">Contraseña</label>
                    <input type="password" class="form-control auth-form-control" id="contraseña" name="password" 
                           placeholder="Contraseña" required>
                </div>
                
                <button type="submit" class="btn btn-auth-primary">Ingresar</button>
            </form>
            
            <a th:href="@{/registro}" class="btn btn-auth-secondary">Registrarse</a>
            
            <div class="auth-link">
                <a th:href="@{/recuperar-contraseña}">Olvidé mi contraseña</a>
            </div>
            
            <div class="auth-link-small">
                <a th:href="@{/setup/admin}">Crear Administrador</a>
            </div>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
