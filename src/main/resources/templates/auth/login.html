<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es" th:classappend="auth-page">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Iniciar Sesión · Urban Bites</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
        <link rel="stylesheet" th:href="@{/css/auth.css}">
    </head>
    <body class="auth-page">
        <div class="auth-background"></div>
        
        <div class="auth-card">
            <div class="auth-logo">
                <img th:src="@{/images/Logo Urban Bites.png}" alt="Urban Bites" class="img-fluid auth-logo-img">
            </div>
            
            <h1 class="auth-title">Iniciar Sesión</h1>
            
            <!-- Mensaje de error -->
            <div th:if="${param.error != null}" class="alert alert-auth alert-auth-danger" role="alert">
                <span class="alert-auth-icon">⚠️</span>
                <p class="alert-auth-message">
                    Credenciales incorrectas. Por favor, verifica tu correo y contraseña e intenta nuevamente.
                </p>
            </div>
            
            <!-- Mensaje de logout exitoso -->
            <div th:if="${param.logout != null}" class="alert alert-auth alert-auth-success" role="alert">
                <span class="alert-auth-icon">✓</span>
                <p class="alert-auth-message">
                    Has cerrado sesión correctamente.
                </p>
            </div>
            
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="correo" class="auth-form-label">Correo</label>
                    <input type="email" 
                           class="form-control auth-form-control"
                           th:classappend="${param.error != null} ? 'is-invalid'"
                           id="correo" 
                           name="username" 
                           placeholder="usuario@email.com" 
                           th:value="${param.username != null ? param.username[0] : ''}"
                           required>
                    <div th:if="${param.error != null}" class="invalid-feedback invalid-feedback-visible">
                        Verifica que el correo sea válido.
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="contraseña" class="auth-form-label">Contraseña</label>
                    <input type="password" 
                           class="form-control auth-form-control"
                           th:classappend="${param.error != null} ? 'is-invalid'"
                           id="contraseña" 
                           name="password" 
                           placeholder="Contraseña" 
                           required>
                    <div th:if="${param.error != null}" class="invalid-feedback invalid-feedback-visible">
                        La contraseña es incorrecta.
                    </div>
                </div>
                
                <button type="submit" class="btn btn-auth-primary">Ingresar</button>
            </form>
            
            <a th:href="@{/registro}" class="btn btn-auth-secondary">Registrarse</a>
        </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
