<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="resenas/fragmentos :: resenasHead"></th:block>
        <title>Reseñas · Urban Bites</title>
        <th:block th:replace="resenas/fragmentos :: resenasHeadContent"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='resenas'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 bg-light-gray">
                <h2 class="fw-bold mb-4">Reseñas de mis Food Trucks</h2>

                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Filter Buttons -->
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <button class="btn btn-sm filter-btn active" data-filter="todos">
                        Todas
                    </button>
                    <button class="btn btn-sm filter-btn" data-filter="aprobada">
                        Aprobadas
                    </button>
                    <button class="btn btn-sm filter-btn" data-filter="pendiente">
                        Pendientes
                    </button>
                    <button class="btn btn-sm filter-btn" data-filter="oculta">
                        Ocultas
                    </button>
                </div>

                <!-- Review Cards -->
                <div th:if="${resenas != null and !resenas.isEmpty()}">
                    <div class="review-card-owner" th:each="resena : ${resenas}">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div class="flex-grow-1">
                                <h5 class="fw-bold mb-2" th:text="${resena.foodtruck?.nombre ?: 'Food Truck'}">Food Truck</h5>
                                <div class="d-flex align-items-center gap-3 mb-2">
                                    <div class="star-rating">
                                        <span th:each="i : ${#numbers.sequence(1, 5)}">
                                            <i th:class="${i <= resena.calificacion} ? 'bi bi-star-fill' : 'bi bi-star'"></i>
                                        </span>
                                        <span class="ms-2 fw-bold" th:text="${resena.calificacion} + '.0'">0.0</span>
                                    </div>
                                    <span class="badge" 
                                          th:class="${resena.estado?.name() == 'aprobada'} ? 'bg-success' : 
                                                      (${resena.estado?.name() == 'pendiente'} ? 'bg-warning text-dark' : 'bg-secondary')"
                                          th:text="${resena.estado != null ? #strings.capitalize(resena.estado.name()) : 'Sin estado'}">
                                        Estado
                                    </span>
                                </div>
                                <div class="mb-2">
                                    <p class="text-muted small mb-1">
                                        <span th:text="'Cliente: '"></span>
                                        <span th:text="${resena.usuario?.nombre ?: ''}"></span>
                                        <span th:text="${resena.usuario?.apellidos ?: 'Anónimo'}"></span>
                                    </p>
                                    <p class="text-muted small mb-1" th:text="'Pedido #' + (${resena.pedido?.idPedido} ?: 'N/A')">Pedido #000</p>
                                    <p class="text-muted small mb-0" th:if="${resena.pedido != null and resena.pedido.estado != null}">
                                        <span th:text="'Estado del pedido: '"></span>
                                        <span class="badge badge-sm" 
                                              th:class="${resena.pedido.estado.name() == 'entregado'} ? 'bg-success' : 
                                                          (${resena.pedido.estado.name() == 'listo'} ? 'bg-info' : 
                                                          (${resena.pedido.estado.name() == 'en_preparacion'} ? 'bg-warning text-dark' : 
                                                          (${resena.pedido.estado.name() == 'recibido'} ? 'bg-secondary' : 'bg-danger')))"
                                              th:text="${#strings.capitalize(#strings.replace(resena.pedido.estado.name(), '_', ' '))}">
                                            Estado
                                        </span>
                                    </p>
                                </div>
                            </div>
                        </div>
                        
                        <div class="mb-3" th:if="${resena.comentario != null and !#strings.isEmpty(resena.comentario)}">
                            <label class="form-label small text-muted mb-1">Comentario:</label>
                            <p class="mb-0 comment-text-bg" th:text="${resena.comentario}">Comentario de la reseña...</p>
                        </div>
                        <div class="mb-3" th:if="${resena.comentario == null or #strings.isEmpty(resena.comentario)}">
                            <p class="text-muted mb-0 fst-italic">Sin comentario</p>
                        </div>
                        
                        <div class="d-flex justify-content-between align-items-center">
                            <p class="text-muted small mb-0" th:text="${resena.fechaCreacion != null ? #temporals.format(resena.fechaCreacion, 'dd MMM yyyy, hh:mm a') : 'Fecha no disponible'}">Fecha</p>
                        </div>
                        
                        <div class="mt-3 pt-3 border-top">
                            <label class="form-label small text-muted mb-2">Cambiar estado de la reseña:</label>
                            <form th:action="@{/resenas/owner/{id}/estado(id=${resena.idResena})}" method="post" class="d-flex gap-2">
                                <select name="estado" class="form-select form-select-sm" required>
                                    <option value="pendiente" th:selected="${resena.estado?.name() == 'pendiente'}">Pendiente</option>
                                    <option value="aprobada" th:selected="${resena.estado?.name() == 'aprobada'}">Aprobada</option>
                                    <option value="oculta" th:selected="${resena.estado?.name() == 'oculta'}">Oculta</option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-urban-primary-sm">
                                    Actualizar
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                
                <div th:if="${resenas == null or resenas.isEmpty()}">
                    <div class="text-center py-5">
                        <i class="bi bi-chat-left-dots empty-icon"></i>
                        <p class="text-muted mt-3">No hay reseñas para tus food trucks aún</p>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="resenas/fragmentos :: resenasScripts"></th:block>
        <script th:src="@{/js/resenas-owner.js}"></script>
    </body>
</html>
