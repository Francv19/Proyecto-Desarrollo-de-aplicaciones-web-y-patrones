<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Crear Reseña · Urban Bites</title>
        <th:block th:replace="app/fragmentos :: appHead"></th:block>
        <link rel="stylesheet" th:href="@{/css/resenas-crear.css}">
        <link rel="stylesheet" th:href="@{/css/common.css}">
    </head>
    <body class="bg-light" th:with="currentPage='resenas'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div class="review-form-card">
                    <h2 class="fw-bold mb-4 review-title-color">Crear Reseña</h2>
                    
                    <div class="mb-4" th:if="${pedido != null}">
                        <h5 class="fw-bold" th:text="${pedido.foodtruck.nombre}">Food Truck</h5>
                        <p class="text-muted small mb-0" th:text="'Pedido #' + ${pedido.idPedido}">Pedido #000</p>
                        <p class="text-muted small mb-0" th:text="${#temporals.format(pedido.fechaCreacion, 'dd MMM yyyy, hh:mm a')}">Fecha</p>
                    </div>

                    <form th:action="@{/resenas/crear}" method="post">
                        <input type="hidden" name="idPedido" th:value="${pedido.idPedido}">
                        
                        <div class="mb-4">
                            <label class="form-label fw-bold">Calificación</label>
                            <div class="star-rating-input">
                                <input type="radio" id="star1" name="calificacion" value="1" required>
                                <label for="star1"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star2" name="calificacion" value="2" required>
                                <label for="star2"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star3" name="calificacion" value="3" required>
                                <label for="star3"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star4" name="calificacion" value="4" required>
                                <label for="star4"><i class="bi bi-star-fill"></i></label>
                                <input type="radio" id="star5" name="calificacion" value="5" required>
                                <label for="star5"><i class="bi bi-star-fill"></i></label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="comentario" class="form-label fw-bold">Comentario (opcional)</label>
                            <textarea class="form-control" id="comentario" name="comentario" rows="4" 
                                      placeholder="Escribe tu opinión sobre el pedido..." maxlength="500"></textarea>
                            <small class="text-muted">Máximo 500 caracteres</small>
                        </div>

                        <div class="d-flex gap-2 justify-content-end">
                            <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-urban-cta">
                                <i class="bi bi-send me-2"></i>Enviar Reseña
                            </button>
                        </div>
                    </form>
                </div>
            </main>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script th:src="@{/js/rutinas.js}"></script>
        <script>
            // Mejorar la experiencia de selección de estrellas
            const starInputs = document.querySelectorAll('.star-rating-input input[type="radio"]');
            const starLabels = document.querySelectorAll('.star-rating-input label');
            
            starInputs.forEach((radio, index) => {
                radio.addEventListener('change', function() {
                    const value = parseInt(this.value);
                    starLabels.forEach((label, labelIndex) => {
                        if (labelIndex < value) {
                            label.classList.add('active');
                            label.style.color = '#ffc107';
                        } else {
                            label.classList.remove('active');
                            label.style.color = '#ddd';
                        }
                    });
                });
            });
            
            // Hover effect
            starLabels.forEach((label, index) => {
                label.addEventListener('mouseenter', function() {
                    const value = index + 1;
                    starLabels.forEach((l, i) => {
                        if (i <= index) {
                            l.style.color = '#ffc107';
                        }
                    });
                });
            });
            
            document.querySelector('.star-rating-input').addEventListener('mouseleave', function() {
                const checkedInput = document.querySelector('.star-rating-input input[type="radio"]:checked');
                if (checkedInput) {
                    const value = parseInt(checkedInput.value);
                    starLabels.forEach((label, index) => {
                        if (index < value) {
                            label.style.color = '#ffc107';
                        } else {
                            label.style.color = '#ddd';
                        }
                    });
                } else {
                    starLabels.forEach(label => {
                        label.style.color = '#ddd';
                    });
                }
            });
        </script>
    </body>
</html>
