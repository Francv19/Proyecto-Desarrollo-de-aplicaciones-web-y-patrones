<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="puntos/fragmentos :: puntosHead"></th:block>
        <title>Saldo de Puntos · Urban Bites</title>
        <th:block th:replace="puntos/fragmentos :: puntosHeadContent"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='puntos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarCliente(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4">
                <h2 class="fw-bold mb-4">Saldo de Puntos</h2>

                <!-- Saldo Card -->
                <div class="saldo-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-2 opacity-75">Saldo Actual</p>
                            <div class="saldo-amount" th:text="${saldo != null ? saldo : 0}">0</div>
                            <p class="mt-2 mb-0 opacity-75">puntos disponibles</p>
                        </div>
                        <div class="text-end">
                            <i class="bi bi-star-fill star-icon-large"></i>
                        </div>
                    </div>
                </div>

                <!-- Movimientos -->
                <div class="mb-3">
                    <h4 class="fw-bold mb-3">Historial de Movimientos</h4>
                    
                    <div th:if="${movimientos != null and !movimientos.isEmpty()}">
                        <div class="movimiento-card" th:each="movimiento : ${movimientos}">
                            <div class="d-flex justify-content-between align-items-start">
                                <div class="flex-grow-1">
                                    <h6 class="fw-bold mb-1" th:text="${movimiento.foodtruck.nombre}">Food Truck</h6>
                                    <p class="text-muted small mb-1" th:text="${movimiento.motivo}">Acumulación por pedido</p>
                                    <p class="text-muted small mb-0" th:text="${#temporals.format(movimiento.fechaCreacion, 'dd MMM yyyy, hh:mm a')}">23 Oct 2025, 05:27 PM</p>
                                </div>
                                <div class="text-end">
                                    <span class="fw-bold fs-5"
                                          th:classappend="${movimiento.tipo != null and movimiento.tipo.name() == 'acumulados'} ? 'movimiento-positivo' : 'movimiento-negativo'">
                                        <span th:if="${movimiento.tipo != null and movimiento.tipo.name() == 'acumulados'}">+</span>
                                        <span th:unless="${movimiento.tipo != null and movimiento.tipo.name() == 'acumulados'}">-</span>
                                        <span th:text="${movimiento.puntos != null ? movimiento.puntos : 0}">0</span>
                                    </span>
                                    <p class="text-muted small mb-0 mt-1" th:text="${movimiento.tipo != null and movimiento.tipo.name() == 'acumulados'} ? 'Acumulados' : 'Redimidos'">Acumulados</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div th:if="${movimientos == null or movimientos.isEmpty()}">
                        <div class="text-center py-5">
                            <i class="bi bi-inbox empty-icon"></i>
                            <p class="text-muted mt-3">No tienes movimientos de puntos aún</p>
                            <a th:href="@{/menu}" class="btn btn-urban-cta">
                                Ver Menú
                            </a>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="puntos/fragmentos :: puntosScripts"></th:block>
    </body>
</html>
