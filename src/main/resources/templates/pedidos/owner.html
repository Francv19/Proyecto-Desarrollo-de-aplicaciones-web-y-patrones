<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <th:block th:replace="pedidos/fragmentos :: pedidosHead"></th:block>
        <title>Lista de Pedidos · Urban Bites</title>
        <th:block th:replace="pedidos/fragmentos :: pedidosHeadContent"></th:block>
    </head>
    <body class="bg-light" th:with="currentPage='pedidos'">
        <div class="d-flex min-vh-100">
            <th:block th:replace="general/fragmentos :: sidebarOwner(${currentPage})"></th:block>

            <main class="flex-grow-1 p-4 main-bg-gray">
                <h2 class="fw-bold mb-4">Lista de Pedidos</h2>

                <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                    <span th:text="${mensaje}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                    <span th:text="${error}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Filter Buttons -->
                <div class="d-flex flex-wrap gap-2 mb-4">
                    <button class="filter-btn active" data-filter="todos">Todos #00</button>
                    <button class="filter-btn" data-filter="recibido">Recibidos #00</button>
                    <button class="filter-btn" data-filter="preparacion">En Preparación #00</button>
                    <button class="filter-btn" data-filter="listo">Listos #00</button>
                    <button class="filter-btn" data-filter="entregado">Entregados #00</button>
                    <button class="filter-btn" data-filter="cancelado">Cancelados #00</button>
                </div>

                <!-- Order Cards -->
                <div class="row g-3" th:if="${pedidos != null and !pedidos.isEmpty()}">
                    <div class="col-md-4" th:each="pedido : ${pedidos}">
                        <div class="order-card">
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h6 class="fw-bold mb-0" th:text="'Orden #' + ${pedido.idPedido}">Orden #000</h6>
                                <span class="badge badge-urban-cta" th:text="${pedido.usuario.nombre + ' ' + pedido.usuario.apellidos}">Usuario</span>
                            </div>
                            <p class="text-muted small mb-3" th:text="${pedido.fechaCreacion != null ? #temporals.format(pedido.fechaCreacion, 'dd MMM yyyy, hh:mm a') : 'Fecha no disponible'}">23 Oct 2025, 05:27 PM</p>
                            
                            <div class="mb-3" th:if="${pedido.detalles != null and !pedido.detalles.isEmpty()}">
                                <div th:each="detalle : ${pedido.detalles}">
                                    <div class="d-flex justify-content-between mb-2">
                                        <div>
                                            <span class="fw-bold" th:text="${detalle.nombreProducto}">Hamburguesa Fresh Tony</span>
                                            <p class="text-muted small mb-0" th:text="${detalle.nombreProducto}">Hamburguesa Fresh Tony</p>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between border-bottom pb-2 mb-2">
                                        <span th:text="${#numbers.formatDecimal(detalle.precioUnit, 0, 'COMMA', 2, 'POINT')}">₡4,500.00</span>
                                        <span th:text="${detalle.cantidad + ' Uds.'}">2 Uds.</span>
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <div>
                                    <span class="text-muted small" th:text="${pedido.detalles != null ? pedido.detalles.size() + ' Artículos' : '0 Artículos'}">x5 Artículos</span>
                                    <p class="fw-bold mb-0 mt-1" th:text="'Total: ' + ${#numbers.formatDecimal(pedido.totalNeto, 0, 'COMMA', 2, 'POINT')}">Total: ₡9,000.00</p>
                                </div>
                            </div>

                            <!-- Estado actual -->
                            <div class="mb-3">
                                <label class="form-label small text-muted mb-1">Estado actual:</label>
                                <div>
                                    <span class="badge" 
                                          th:class="${pedido.estado != null and pedido.estado.name() == 'entregado'} ? 'bg-success' : (${pedido.estado != null and pedido.estado.name() == 'listo'} ? 'bg-info' : (${pedido.estado != null and pedido.estado.name() == 'en_preparacion'} ? 'bg-warning text-dark' : (${pedido.estado != null and pedido.estado.name() == 'recibido'} ? 'bg-secondary' : 'bg-danger')))"
                                          th:text="${pedido.estado != null ? #strings.capitalize(#strings.replace(pedido.estado.name(), '_', ' ')) : 'Sin estado'}">
                                        Estado
                                    </span>
                                </div>
                            </div>

                            <!-- Actualizar Estado -->
                            <div class="mb-3">
                                <form th:action="@{/pedidos/{id}/estado(id=${pedido.idPedido})}" method="post" class="d-flex gap-2">
                                    <select name="estado" class="form-select form-select-sm" required>
                                        <option value="">Seleccionar estado...</option>
                                        <option value="recibido" th:selected="${pedido.estado != null and pedido.estado.name() == 'recibido'}">Recibido</option>
                                        <option value="en_preparacion" th:selected="${pedido.estado != null and pedido.estado.name() == 'en_preparacion'}">En Preparación</option>
                                        <option value="listo" th:selected="${pedido.estado != null and pedido.estado.name() == 'listo'}">Listo</option>
                                        <option value="entregado" th:selected="${pedido.estado != null and pedido.estado.name() == 'entregado'}">Entregado</option>
                                        <option value="cancelado" th:selected="${pedido.estado != null and pedido.estado.name() == 'cancelado'}">Cancelado</option>
                                    </select>
                                    <button type="submit" class="btn btn-sm btn-urban-primary-sm">
                                        Actualizar
                                    </button>
                                </form>
                            </div>

                            <!-- ETA Input -->
                            <div class="mt-3">
                                <form th:action="@{/pedidos/{id}/eta(id=${pedido.idPedido})}" method="post" class="d-flex gap-2">
                                    <input type="number" 
                                           name="etaMinutos" 
                                           class="form-control form-control-sm" 
                                           placeholder="ETA (minutos)" 
                                           th:value="${pedido.etaMinutos}"
                                           min="1">
                                    <button type="submit" class="btn btn-sm btn-urban-cta-sm">
                                        Establecer ETA
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:if="${pedidos == null or pedidos.isEmpty()}">
                    <div class="text-center py-5">
                        <i class="bi bi-inbox empty-icon-large"></i>
                        <p class="text-muted mt-3">No hay pedidos en este momento</p>
                    </div>
                </div>
            </main>
        </div>

        <th:block th:replace="pedidos/fragmentos :: pedidosScripts"></th:block>
        <script th:src="@{/js/pedidos-owner.js}"></script>
    </body>
</html>
